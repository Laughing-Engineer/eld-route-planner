services:
  - type: web
    name: eld-route-planner-api
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "eld-route-planner-api-fga1.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://eld-route-planner-pi.vercel.app"
      - key: MONGODB_URI
        sync: false
      - key: NOMINATIM_USER_AGENT
        value: "ELDRoutePlanner/1.0 (contact@eldplanner.local)"
      - key: OSRM_BASE_URL
        value: "http://router.project-osrm.org"
